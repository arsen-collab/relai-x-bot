name: Daily GM

# Target window is 09:00-10:00 Europe/Zurich.
# GitHub cron is UTC only, and DST shifts Zurich by an hour, so no single
# UTC time sits inside that window year round. These four crons span
# 07:00-09:00 UTC; post_gm.py works out which of them land inside the
# local window today and picks one winner among those.
#   winter (CET, UTC+1):  08:05 -> 09:05,  08:35 -> 09:35
#   summer (CEST, UTC+2): 07:05 -> 09:05,  07:35 -> 09:35

on:
  schedule:
    - cron: '5 7 * * *'   # SLOT 1
    - cron: '35 7 * * *'  # SLOT 2
    - cron: '5 8 * * *'   # SLOT 3
    - cron: '35 8 * * *'  # SLOT 4
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, do not post'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Map cron to slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "5 7 * * *")  echo "n=1" >> $GITHUB_OUTPUT ;;
            "35 7 * * *") echo "n=2" >> $GITHUB_OUTPUT ;;
            "5 8 * * *")  echo "n=3" >> $GITHUB_OUTPUT ;;
            "35 8 * * *") echo "n=4" >> $GITHUB_OUTPUT ;;
            *)            echo "n=0" >> $GITHUB_OUTPUT ;;
          esac

      - name: Post GM
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SLOT: ${{ steps.slot.outputs.n }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post_gm.py
