name: Evergreen Tweet

# Every Monday, targeting 09:00-13:00 Europe/Zurich.
# 08:00-11:00 UTC lands inside that window in both CET and CEST:
#   winter 08:10 UTC -> 09:10 CET   |   summer 08:10 UTC -> 10:10 CEST
#   winter 10:40 UTC -> 11:40 CET   |   summer 10:40 UTC -> 12:40 CEST
# post_evergreen.py allows posting up to 20:00 local, which absorbs roughly
# 7 to 11 hours of GitHub cron delay. This content is not time sensitive,
# so a late post beats a missed one.
# Cron day-of-week is UTC; at these hours UTC and Zurich share a calendar
# day, so 1 = Monday locally too.

on:
  schedule:
    - cron: '10 8 * * 1'   # SLOT 1
    - cron: '0 9 * * 1'    # SLOT 2
    - cron: '50 9 * * 1'   # SLOT 3
    - cron: '40 10 * * 1'  # SLOT 4
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, do not post'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Map cron to slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "10 8 * * 1")  echo "n=1" >> $GITHUB_OUTPUT ;;
            "0 9 * * 1")   echo "n=2" >> $GITHUB_OUTPUT ;;
            "50 9 * * 1")  echo "n=3" >> $GITHUB_OUTPUT ;;
            "40 10 * * 1") echo "n=4" >> $GITHUB_OUTPUT ;;
            *)             echo "n=0" >> $GITHUB_OUTPUT ;;
          esac
      - name: Post evergreen tweet
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SLOT: ${{ steps.slot.outputs.n }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post_evergreen.py
