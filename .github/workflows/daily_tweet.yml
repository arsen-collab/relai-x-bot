name: Daily Market Update

# Every day, targeting 09:00-13:00 Europe/Zurich.
# 08:00-11:00 UTC lands inside that window in both CET and CEST:
#   winter 08:10 UTC -> 09:10 CET   |   summer 08:10 UTC -> 10:10 CEST
#   winter 10:40 UTC -> 11:40 CET   |   summer 10:40 UTC -> 12:40 CEST
# post_tweet.py allows posting up to 20:00 local, absorbing roughly 7 to 11
# hours of GitHub cron delay before the day is skipped.
# All four slots sit early in the window on purpose: only one slot per day
# posts, so headroom comes from firing early, not from adding more slots.

on:
  schedule:
    - cron: '10 8 * * *'   # SLOT 1
    - cron: '0 9 * * *'    # SLOT 2
    - cron: '50 9 * * *'   # SLOT 3
    - cron: '40 10 * * *'  # SLOT 4
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only, do not post'
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Map cron to slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "10 8 * * *")  echo "n=1" >> $GITHUB_OUTPUT ;;
            "0 9 * * *")   echo "n=2" >> $GITHUB_OUTPUT ;;
            "50 9 * * *")  echo "n=3" >> $GITHUB_OUTPUT ;;
            "40 10 * * *") echo "n=4" >> $GITHUB_OUTPUT ;;
            *)             echo "n=0" >> $GITHUB_OUTPUT ;;
          esac
      - name: Post market update
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SLOT: ${{ steps.slot.outputs.n }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python post_tweet.py
